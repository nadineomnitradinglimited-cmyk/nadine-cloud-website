# Royal South Luangwa Safaris: royalsouthluangwa.com  (private repo; pages are already built in the repo, so it deploys `main` as is)
NAME=royal
REPO_PATH=nadineomnitradinglimited-cmyk/royal-south-luangwa-safaris
BRANCH=main
PRIVATE=1
APP_DIR=$HOME_DIR/royalapp
NPM_DIR=$APP_DIR
LOCK_FILE=package-lock.json
NODE=$HOME_DIR/nodevenv/royalapp/24/bin/node
VENV=$HOME_DIR/nodevenv/royalapp/24/bin/activate
# Every backend file the app loads must be listed here, or it never reaches the server
SYNC_FILES="package.json package-lock.json backend/server.js backend/mailbox.js"
SYNC_DIRS_REPLACE="frontend"
SYNC_MAP=""
CHECK_JS="backend/server.js backend/mailbox.js"
REQUIRED="backend/server.js backend/mailbox.js frontend/index.html package.json package-lock.json"
BACKUP_PATHS="package.json package-lock.json backend/server.js backend/mailbox.js"
RESTART_FILE=$APP_DIR/tmp/restart.txt
