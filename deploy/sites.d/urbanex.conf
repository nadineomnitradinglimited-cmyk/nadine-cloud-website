# Urbanex Logistics: urbanexlogistics.com  (private repo; the `deploy` branch is built and published by deploy/publish.sh in that repo)
NAME=urbanex
REPO_PATH=nadineomnitradinglimited-cmyk/urbanexlogistics
BRANCH=deploy
PRIVATE=1
APP_DIR=$HOME_DIR/urbanexapp
NPM_DIR=$APP_DIR/backend
LOCK_FILE=package-lock.json
NODE=$HOME_DIR/nodevenv/urbanexapp/backend/24/bin/node
VENV=$HOME_DIR/nodevenv/urbanexapp/backend/24/bin/activate
SYNC_FILES="backend/package.json backend/package-lock.json"
SYNC_DIRS_REPLACE="backend/src frontend/dist database/migrations"
SYNC_MAP=""
CHECK_JS="backend/src/server.js"
REQUIRED="backend/src/server.js backend/package.json backend/package-lock.json frontend/dist/index.html database/migrations"
BACKUP_PATHS="backend/package.json backend/package-lock.json backend/src database"
RESTART_FILE=$APP_DIR/backend/tmp/restart.txt
