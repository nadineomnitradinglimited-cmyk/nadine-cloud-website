[package]
name = "nadine-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
once_cell = "1.21.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "native-tls"] }
roxmltree = "0.21.1"
scrypt = { version = "0.12.0", default-features = false, features = ["kdf"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
socket2 = "0.6.5"
sqlx = { version = "0.9.0", features = ["postgres", "chrono", "tls-native-tls", "macros", "runtime-tokio"] }
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
